  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      padding: 20px;
    }

    .error-box {
      text-align: center;
      background: white;
      border-radius: 24px;
      padding: 60px 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    .error-code {
      font-size: 120px;
      font-weight: 900;
      color: #f97316;
      line-height: 1;
      margin-bottom: 10px;
    }

    .error-icon {
      font-size: 60px;
      margin-bottom: 20px;
      display: block;
    }

    .error-title {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }

    .error-msg {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .error-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-btns a {
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-home {
      background: #f97316;
      color: white;
    }

    .btn-home:hover {
      background: #ea580c;
      transform: scale(1.05);
    }

    .btn-back {
      background: #f3f4f6;
      color: #111827;
      border: 2px solid #e5e7eb;
    }

    .btn-back:hover {
      background: #e5e7eb;
    }
  </style>
</head>

<body>
  <div class="error-page">
    <div class="error-box">
      <span class="error-icon">🛒</span>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found!</h1>
      <p class="error-msg">Oops! The page you're looking for doesn't exist.<br>Maybe the product flew away 🚀</p>
      <div class="error-btns">
        <a href="index.html" class="btn-home"><i class="fa fa-home"></i> Go Home</a>
        <a href="javascript:history.back()" class="btn-back"><i class="fa fa-arrow-left"></i> Go Back</a>
      </div>
    </div>
  </div>
  <script src="js/cart.js"></script>
</body>

</html>
